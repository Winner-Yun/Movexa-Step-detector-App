name: step_detector
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.0.2
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  intl: ^0.20.3
  provider: ^6.1.5+1
  google_sign_in: 6.2.1
  pedometer: ^4.2.0
  permission_handler: ^13.0.1
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  shimmer: ^4.0.0
  home_widget: ^0.9.3
  flutter_launcher_icons: ^0.13.1
  gal: ^2.3.3
  flutter_foreground_task: ^11.0.1
  shared_preferences: ^2.5.5
  google_maps_flutter: ^2.18.0
  flutter_native_splash: ^2.4.7
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Movexa_appicon.png"

flutter:
  
  uses-material-design: true
  assets:
    - assets/
    - .env


flutter_native_splash:
  color: "#ffffff"
  image: assets/movexa_splash_formatted.png
  branding: assets/movexa_branding_formatted.png
  branding_mode: bottom

  android: true
  ios: true
  fullscreen: true

  android_gravity: center
  ios_content_mode: center

  android_12:
    color: "#ffffff"
    image: assets/movexa_splash_formatted.png
    branding: assets/movexa_branding_formatted.png
    icon_background_color: "#ffffff"
    fullscreen: true